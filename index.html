<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F4EA; --surface: #ffffff; --border: #EEF1EA;
      --muted: #8A978E; --body: #1F2A22;
      --green-deep: #14492F; --green: #1E6B47; --green-light: #3E9A63;
      --cream-strong: #F6E7B8;
    }
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--body);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem;
    }
    .logo { width: 68px; height: 68px; margin-bottom: 1.25rem; }
    h1 {
      font-size: clamp(1.4rem, 4vw, 1.9rem); font-weight: 800;
      text-align: center; text-wrap: balance; margin-bottom: .35rem;
      color: var(--green-deep);
    }
    .tagline { font-size: .85rem; color: var(--muted); margin-bottom: .2rem; text-align: center; }
    .divider { width: 36px; height: 1px; background: var(--border); margin: 1.75rem auto 2rem; }
    .prompt {
      font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1rem; text-align: center;
    }
    .lang-cards { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .lang-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      text-decoration: none; color: inherit;
      text-align: center; min-width: 160px;
      box-shadow: 0 1px 2px rgba(20,73,47,.06), 0 8px 24px rgba(20,73,47,.06);
      transition: border-color .2s, transform .2s;
    }
    .lang-card:hover { border-color: var(--green-light); transform: translateY(-3px); }
    .lang-flag { font-size: 2rem; margin-bottom: .6rem; }
    .lang-name { font-size: 1.05rem; font-weight: 700; color: var(--green-deep); margin-bottom: .25rem; }
    .lang-sub { font-size: .78rem; color: var(--muted); }
    footer { margin-top: 3.5rem; font-size: .72rem; color: var(--muted); text-align: center; }
    :focus-visible { outline: 2px solid var(--green-light); outline-offset: 2px; }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
    <defs><clipPath id="rLogo"><rect width="512" height="512" rx="112"></rect></clipPath></defs>
    <g clip-path="url(#rLogo)">
      <rect width="512" height="512" fill="#14492F"></rect>
      <circle cx="256" cy="262" r="96" fill="#F6E7B8"></circle>
      <path d="M0,318 C140,268 372,268 512,318 L512,512 L0,512 Z" fill="#3E9A63"></path>
      <path d="M150,512 C200,440 300,420 268,360 C254,334 250,296 250,284 L262,284 C266,300 286,334 300,358 C344,424 290,456 362,512 Z" fill="#F5F0E3"></path>
      <g fill="#14492F"><rect x="246" y="186" width="20" height="100" rx="2"></rect><rect x="222" y="214" width="68" height="20" rx="2"></rect></g>
    </g>
  </svg>
  <h1>Giờ Lễ & Lịch Công Giáo</h1>
  <p class="tagline">Điểm danh nhà thờ &amp; Cộng đồng đức tin</p>
  <div class="divider"></div>
  <p class="prompt">Chọn ngôn ngữ / Select language</p>
  <div class="lang-cards">
    <a class="lang-card" href="vn/index.html">
      <div class="lang-flag">🇻🇳</div>
      <div class="lang-name">Tiếng Việt</div>
      <div class="lang-sub">Trang chủ &amp; Pháp lý</div>
    </a>
    <a class="lang-card" href="en/index.html">
      <div class="lang-flag">🇬🇧</div>
      <div class="lang-name">English</div>
      <div class="lang-sub">Home &amp; Legal</div>
    </a>
  </div>
  <footer>© 2026 Giờ Lễ & Lịch Công Giáo</footer>
</body>
</html>
